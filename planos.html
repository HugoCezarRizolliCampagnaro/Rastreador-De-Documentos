<!DOCTYPE html>
<!-- Planos — mesmo design system, preços atualizados, limite real do plano Grátis -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<meta name="theme-color" content="#0B0E14">

</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --marca: #3D4FE0;
    --marca-hover: #2E3FC0;
    --bg: #F7F8FA;
    --superficie: #FFFFFF;
    --texto: #14161A;
    --texto-muted: #6B7280;
    --borda: #E3E5E9;
    --status-verde: #1F9D55;
    --status-amarelo: #F5A623;
    --status-vermelho: #E5484D;
  }

  html.escuro {
    --bg: #0B0E14;
    --superficie: #141821;
    --texto: #F1F2F4;
    --texto-muted: #8A93A3;
    --borda: #232833;
    --marca: #5B6EF5;
    --marca-hover: #4457E0;
    --status-verde: #22C55E;
    --status-amarelo: #F5A623;
    --status-vermelho: #F2555C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
    animation: entrada 0.3s ease;
  }

  @keyframes entrada { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  svg.icone { display: block; flex-shrink: 0; }

  .glow-fundo {
    position: fixed; top: -180px; left: 15%;
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(91, 110, 245, 0.35), transparent 70%);
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
  }

  html:not(.escuro) .glow-fundo { display: none; }

  .app-shell { display: flex; min-height: 100vh; position: relative; z-index: 1; }

  .sidebar {
    position: fixed; top: 0; left: 0; height: 100vh; width: 250px;
    display: flex; flex-direction: column;
    padding: 22px 14px;
    background: var(--superficie);
    border-right: 1px solid var(--borda);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 40;
  }

  .sidebar.aberta { transform: translateX(0); }
  .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 35; display: none; }
  .sidebar-backdrop.ativo { display: block; }

  @media (min-width: 960px) {
    .sidebar { position: sticky; transform: none; }
    .sidebar-backdrop { display: none !important; }
    .botao-menu { display: none; }
    .conteudo-principal { flex: 1; min-width: 0; }
    .cabecalho, .conteudo { max-width: 1080px; padding-left: 32px; padding-right: 32px; }
  }

  .sidebar-marca { display: flex; align-items: center; gap: 10px; padding: 6px 10px 22px; }
  .sidebar-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--marca); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sidebar-titulo { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
  .sidebar-subtitulo { font-size: 11px; color: var(--texto-muted); }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }

  .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--texto-muted); text-decoration: none; font-size: 14px; font-weight: 500; }
  .sidebar-item:hover { background: var(--bg); }
  .sidebar-item.ativo { background: rgba(91, 110, 245, 0.14); color: var(--marca); font-weight: 600; }

  .sidebar-perfil { display: flex; align-items: center; gap: 10px; padding: 12px 10px 4px; border-top: 1px solid var(--borda); margin-top: 10px; text-decoration: none; color: var(--texto); }
  .sidebar-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--marca); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .sidebar-perfil-nome { font-size: 12.5px; font-weight: 600; word-break: break-all; }
  .sidebar-perfil-sub { font-size: 11px; color: var(--texto-muted); }
  .sidebar-perfil-seta { margin-left: auto; color: var(--texto-muted); flex-shrink: 0; }

  .cabecalho { max-width: 1080px; margin: 0 auto; padding: 24px 20px 4px; }
  .topo-pagina { display: flex; align-items: flex-start; gap: 14px; }

  .botao-menu { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .pagina-icone { width: 46px; height: 46px; border-radius: 12px; background: var(--marca); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .cabecalho h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
  .pagina-sub { font-size: 13.5px; color: var(--texto-muted); margin: 0; }

  .mensagem-principal {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--texto);
    margin: 28px 0 24px;
  }

  .conteudo { max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }

  /* cards de planos */

  .planos-grade { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 32px; }
  @media (min-width: 720px) { .planos-grade { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1080px) { .planos-grade { grid-template-columns: repeat(4, 1fr); } }

  .plano-card {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .plano-card.destaque {
    border: 1.5px solid var(--marca);
    box-shadow: 0 0 0 3px rgba(91, 110, 245, 0.14), 0 12px 30px rgba(91, 110, 245, 0.18);
  }

  .plano-selo {
    position: absolute; top: -11px; left: 22px;
    font-size: 10.5px; font-weight: 700;
    color: #FFFFFF;
    background: var(--marca);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .plano-icone { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .plano-nome { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .plano-desc { font-size: 12.5px; color: var(--texto-muted); margin-bottom: 14px; min-height: 32px; }

  .plano-preco { font-size: 26px; font-weight: 700; }
  .plano-preco span { font-size: 13px; font-weight: 500; color: var(--texto-muted); }
  .plano-preco-anual { font-size: 12px; color: var(--status-verde); font-weight: 600; margin-top: 4px; }

  .plano-uso { margin: 14px 0; }
  .plano-uso-linha { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--texto-muted); margin-bottom: 6px; }
  .plano-uso-barra { height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .plano-uso-barra-preenchida { height: 100%; border-radius: 999px; background: var(--marca); transition: width 0.5s ease; }
  .plano-uso-barra-preenchida.cheio { background: var(--status-vermelho); }

  .plano-lista { list-style: none; padding: 0; margin: 8px 0 18px; font-size: 13px; color: var(--texto); flex: 1; }
  .plano-lista li { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; }
  .plano-lista svg.icone { color: var(--marca); margin-top: 2px; }

  .plano-trial { font-size: 11.5px; font-weight: 700; color: var(--marca); margin-bottom: 10px; }

  .plano-botao {
    width: 100%; padding: 12px;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    border-radius: 9px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }

  .plano-botao.atual { background: var(--bg); border: 1.5px solid var(--borda); color: var(--texto-muted); cursor: default; }
  .plano-botao.principal { background: var(--marca); border: none; color: #FFFFFF; }
  .plano-botao.principal:hover { background: var(--marca-hover); }
  .plano-botao.em-breve { background: none; border: 1.5px solid var(--borda); color: var(--texto-muted); }

  /* comparação */

  .secao-card { background: var(--superficie); border: 1px solid var(--borda); border-radius: 16px; padding: 22px; overflow-x: auto; }
  .secao-titulo-grande { font-size: 16px; font-weight: 700; margin: 0 0 16px; }

  table.tabela-comparacao { width: 100%; border-collapse: collapse; min-width: 560px; font-size: 13px; }
  .tabela-comparacao th, .tabela-comparacao td { text-align: center; padding: 10px 8px; border-bottom: 1px solid var(--borda); }
  .tabela-comparacao th:first-child, .tabela-comparacao td:first-child { text-align: left; color: var(--texto-muted); font-weight: 500; }
  .tabela-comparacao th { font-weight: 700; color: var(--texto); }
  .tabela-comparacao svg.icone { margin: 0 auto; color: var(--status-verde); }
  .tabela-comparacao .traco { color: var(--texto-muted); }

  /* fab */

  .fab {
    position: fixed; right: 20px; bottom: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--marca); color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(91, 110, 245, 0.5);
    transition: background 0.15s ease, transform 0.15s ease;
    animation: pulso 2.5s ease-in-out infinite;
    z-index: 6;
  }

  @keyframes pulso { 0%, 100% { box-shadow: 0 6px 20px rgba(91,110,245,0.5); } 50% { box-shadow: 0 6px 26px rgba(91,110,245,0.75); } }
  .fab:hover { background: var(--marca-hover); transform: scale(1.06); }
</style>
</head>
<body>

  <div class="glow-fundo"></div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-marca">
        <span class="sidebar-logo" id="sidebar-logo"></span>
        <div>
          <div class="sidebar-titulo">Rastreador</div>
          <div class="sidebar-subtitulo">de Documentos</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <a href="perfil.html" class="sidebar-perfil">
        <span class="sidebar-avatar" id="sidebar-avatar">?</span>
        <div>
          <div class="sidebar-perfil-nome" id="sidebar-email">Carregando...</div>

        </div>
        <span class="sidebar-perfil-seta" id="sidebar-perfil-seta"></span>

    <div class="conteudo-principal">
      <div class="cabecalho">

          <button type="button" class="botao-menu" id="botao-menu" aria-label="Abrir menu"></button>
          <div class="pagina-icone" id="pagina-icone"></div>
          <div>
            <h1>Planos</h1>

          </div>
        </div>
        <p class="mensagem-principal">Comece grátis. Faça upgrade quando precisar.</p>
      </div>

      <div class="conteudo">

        <div class="secao-card">

          <table class="tabela-comparacao">

  </div>

  <a class="fab" href="novo-documento.html" aria-label="Cadastrar documento" id="fab-adicionar"></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://qybgrfdvpptnauyqtdxu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_brDnSPSCu4ry9QTe-pYwag_zRqB6hkL';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const LIMITE_GRATIS = 3;

    const CORPOS_ICONE = {
      home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
      dollarSign: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
      calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
      messageCircle: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
      fileText: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
      menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      chevronRight: '<polyline points="9 18 15 12 9 6"/>',
      user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
      check: '<polyline points="20 6 9 17 4 12"/>',
      creditCard: '<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
    };

    function icone(nome, tamanho, corTraco) {
      const tam = tamanho || 18;
      const cor = corTraco || 'currentColor';
      return `<svg class="icone" width="${tam}" height="${tam}" viewBox="0 0 24 24" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CORPOS_ICONE[nome] || ''}</svg>`;
    }

    document.getElementById('sidebar-logo').innerHTML = icone('fileText', 18, '#FFFFFF');
    document.getElementById('botao-menu').innerHTML = icone('menu', 18);
    document.getElementById('pagina-icone').innerHTML = icone('creditCard', 22, '#FFFFFF');
    document.getElementById('sidebar-perfil-seta').innerHTML = icone('chevronRight', 16);
    document.getElementById('fab-adicionar').innerHTML = icone('plus', 26, '#FFFFFF');

    document.getElementById('sidebar-nav').innerHTML = [
      { href: 'index.html', nome: 'home', label: 'Início' },
      { href: 'gastos.html', nome: 'dollarSign', label: 'Gastos' },
      { href: 'calendario.html', nome: 'calendar', label: 'Calendário' },
      { href: 'assistente.html', nome: 'messageCircle', label: 'Assistente' },
    ].map(function (item) {
      return `<a href="${item.href}" class="sidebar-item${item.ativo ? ' ativo' : ''}">${icone(item.nome, 18)}${item.label}</a>`;
    }).join('');

    /* ---------- gaveta lateral ---------- */

    const sidebarEl = document.getElementById('sidebar');
    const backdropEl = document.getElementById('sidebar-backdrop');
    document.getElementById('botao-menu').addEventListener('click', function () {
      sidebarEl.classList.add('aberta');
      backdropEl.classList.add('ativo');
    });
    backdropEl.addEventListener('click', function () {
      sidebarEl.classList.remove('aberta');
      backdropEl.classList.remove('ativo');
    });

    /* ---------- planos ---------- */

    function renderPlanos(usoAtual) {
      const percentualUso = Math.min(100, Math.round((usoAtual / LIMITE_GRATIS) * 100));

      const grade = document.getElementById('planos-grade');
      grade.innerHTML = `
        <div class="plano-card">
          <div class="plano-icone" style="background: rgba(138,147,163,0.16); color: var(--texto-muted);">${icone('user', 18)}</div>
          <div class="plano-nome">Grátis</div>
          <div class="plano-desc">Para começar a organizar seus documentos.</div>
          <div class="plano-preco">R$ 0<span>/mês</span></div>
          <div class="plano-uso">
            <div class="plano-uso-linha"><span>${usoAtual} de ${LIMITE_GRATIS} documentos usados</span></div>
            <div class="plano-uso-barra"><div class="plano-uso-barra-preenchida${usoAtual >= LIMITE_GRATIS ? ' cheio' : ''}" style="width: ${percentualUso}%;"></div></div>
          </div>
          <ul class="plano-lista">
            <li>${icone('check', 14)} Cadastro e edição</li>
            <li>${icone('check', 14)} Anexo de PDF e foto</li>
            <li>${icone('check', 14)} Categorias e busca</li>
            <li>${icone('check', 14)} Calendário</li>
            <li>${icone('check', 14)} Notificações básicas</li>
          </ul>
          <button type="button" class="plano-botao atual" disabled>Seu plano atual</button>
        </div>

        <div class="plano-card destaque">
          <span class="plano-selo">MAIS POPULAR</span>
          <div class="plano-icone" style="background: rgba(91,110,245,0.16); color: var(--marca);">${icone('star', 18)}</div>
          <div class="plano-nome">Premium</div>
          <div class="plano-desc">Tenha mais controle sobre seus documentos.</div>
          <div class="plano-preco">R$ 9,90<span>/mês</span></div>
          <div class="plano-preco-anual">ou R$ 79,90/ano — economize</div>
          <ul class="plano-lista" style="margin-top: 14px;">
            <li>${icone('check', 14)} Documentos ilimitados</li>
            <li>${icone('check', 14)} Checklist completo de renovação</li>
            <li>${icone('check', 14)} Histórico avançado e score de conformidade</li>
            <li>${icone('check', 14)} Relatórios em PDF e backup</li>
            <li>${icone('check', 14)} Compartilhamento e assistente inteligente</li>
            <li>${icone('check', 14)} OCR de documentos</li>
          </ul>
          <div class="plano-trial">30 dias grátis para testar</div>
          <button type="button" class="plano-botao principal" id="btn-premium">Começar teste grátis</button>
        </div>

        <div class="plano-card">
          <div class="plano-icone" style="background: rgba(168,128,246,0.18); color: #A880F6;">${icone('users', 18)}</div>
          <div class="plano-nome">Família</div>
          <div class="plano-desc">Para organizar documentos de toda a família.</div>
          <div class="plano-preco">R$ 14,90<span>/mês</span></div>
          <ul class="plano-lista" style="margin-top: 14px;">
            <li>${icone('check', 14)} Tudo do Premium</li>
            <li>${icone('check', 14)} Até 5 pessoas</li>
            <li>${icone('check', 14)} Documentos organizados por pessoa</li>
          </ul>
          <button type="button" class="plano-botao em-breve" disabled>Em breve</button>
        </div>

        <div class="plano-card">
          <div class="plano-icone" style="background: rgba(34,197,94,0.16); color: var(--status-verde);">${icone('briefcase', 18)}</div>
          <div class="plano-nome">Profissional</div>
          <div class="plano-desc">Para profissionais e pequenos negócios.</div>
          <div class="plano-preco">R$ 29,90<span>/mês</span></div>
          <ul class="plano-lista" style="margin-top: 14px;">
            <li>${icone('check', 14)} Tudo do Premium</li>
            <li>${icone('check', 14)} Até 3 clientes/empresas</li>
            <li>${icone('check', 14)} Até 100 documentos</li>
            <li>${icone('check', 14)} Relatórios profissionais</li>
          </ul>
          <button type="button" class="plano-botao em-breve" disabled>Em breve</button>
        </div>
      `;

      document.getElementById('btn-premium').addEventListener('click', function () {
        alert('O pagamento do Premium ainda está em preparação. Assim que estiver pronto, você vai poder testar 30 dias grátis por aqui mesmo.');
      });
    }

    function renderComparacao() {
      const check = icone('check', 16);
      const tr = '<span class="traco">—</span>';
      const linhas = [
        ['Documentos', 'Até 3', 'Ilimitados', 'Ilimitados', 'Ilimitados'],
        ['Anexo de PDF/foto', check, check, check, check],
        ['Checklist de renovação', tr, check, check, check],
        ['Histórico avançado', tr, check, check, check],
        ['Relatórios em PDF', check, check, check, check],
        ['Assistente inteligente', 'Básico', check, check, check],
        ['Pessoas na conta', '1', '1', 'Até 5', '—'],
        ['Clientes/empresas', tr, tr, tr, 'Até 3'],
      ];
      document.getElementById('corpo-comparacao').innerHTML = linhas.map(function (l) {
        return `<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]}</td></tr>`;
      }).join('');
    }

    /* ---------- sessão ---------- */

    sb.auth.getSession().then(async function (resultado) {
      if (!resultado.data.session) {
        window.location.href = 'login.html';
        return;
      }
      const email = resultado.data.session.user.email;
      document.getElementById('sidebar-email').textContent = email;
      document.getElementById('sidebar-avatar').textContent = email.charAt(0).toUpperCase();

      const { count } = await sb.from('documentos').select('id', { count: 'exact', head: true });
      renderPlanos(count || 0);
      renderComparacao();
    });
  </script>

</body>
</html>
